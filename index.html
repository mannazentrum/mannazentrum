<!DOCTYPE html>
<html lang="id" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mannazentrum - PT. Elrafa Terang Sejahtera</title>
    <meta name="description" content="Mannazentrum hadir sebagai mitra orang tua dalam mengasuh dan mendidik buah hati dengan penuh kasih sayang. Daycare, Preschool, dan Ekosistem Pendidikan Terpercaya.">
    <meta name="theme-color" content="#42210b">

    <!-- Resource hints for external assets -->
    <!-- Hero/product images (Unsplash) are above the fold on MM Store -->
    <link rel="preconnect" href="https://images.unsplash.com">
    <!-- Google Maps iframe is lazy-loaded below the fold: DNS only, no early connection -->
    <link rel="dns-prefetch" href="https://www.google.com">
    <!-- Vercel Analytics -->
    <link rel="dns-prefetch" href="https://va.vercel-scripts.com">

    <style>
        :root {
            --bg-app: #f7f3e3;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-app);
            transition: background-color 0.5s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto !important; }
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #42210b; border-radius: 10px; }

        .font-nunito { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        .animate-fadeIn {
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media print {
            @page { size: A4; margin: 0; }
            html, body { height: auto; background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; visibility: visible !important; width: 100% !important; padding: 1.5cm !important; }
        }

        .print-only { display: none; }
    </style>
</head>
<body class="overflow-x-hidden font-sans">
    <div id="root"></div>

    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
